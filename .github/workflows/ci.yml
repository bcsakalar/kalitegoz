name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bagimliliklari kur
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Testler (SQLite; harici servis gerekmez)
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-key-32-bytes-long-x
        run: python -m pytest -q

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - name: Tip kontrolu
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build (lint dahil)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend imaji
        run: docker build -t kalitegoz-api ./backend
      - name: Frontend imaji
        run: docker build -t kalitegoz-frontend ./frontend
